x-runtime: &runtime
  image: ${IMAGE:-hydrooj-aibot:local}
  build: .
  init: true
  env_file: ./config/.env
  environment:
    WEBUI_USERNAME: ${WEBUI_USERNAME:-admin}
    WEBUI_PASSWORD: ${WEBUI_PASSWORD:?Please set WEBUI_PASSWORD in config/.env}
    # Web 与守护进程同容器：默认随 Web 自动启动，可在 Web 中停止。
    WEBUI_AUTOSTART_DAEMON: ${WEBUI_AUTOSTART_DAEMON:-1}
  volumes:
    - data:/data
  read_only: true
  tmpfs:
    # Local validation compiles and executes temporary C++ binaries.
    - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  stop_grace_period: 30s

services:
  web:
    <<: *runtime
    command: [web, --host, 0.0.0.0, --port, '5000']
    ports:
      - '127.0.0.1:${WEBUI_PORT:-5000}:5000'
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  cli:
    <<: *runtime
    profiles: [tools]
    command: [doctor]

volumes:
  data:
