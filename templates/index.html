<!DOCTYPE html>
<html lang="zh" data-mantine-color-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OJ Solver</title>
<style>
:root {
  --bg: #1a1b2e; --panel: #222440; --border: #313458; --text: #d0d4f0;
  --accent: #7b6cf6; --green: #4ecf8c; --red: #f0506e; --yellow: #f0cf50;
  --radius: 8px; --font: 'Segoe UI', system-ui, sans-serif; --mono: 'Cascadia Code', 'Fira Code', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
.header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.header .dot.off { background: var(--border); }
.tabs { display: flex; gap: 4px; margin-bottom: 24px; }
.tab { padding: 8px 20px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; color: #888; background: transparent; }
.tab.active { color: var(--accent); border-color: var(--border); border-bottom-color: var(--panel); background: var(--panel); }
.main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.main > div { display: none; }
.main > div.active { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 800px) { .main > div.active { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #b8bcf0; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.card h2 .expand { margin-left: auto; cursor: pointer; font-size: 18px; color: #888; }
label { display: block; font-size: 12px; color: #888cb0; margin-bottom: 4px; margin-top: 10px; }
input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; background: #1a1b2e; color: var(--text); font-size: 13px; font-family: var(--font); resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { font-family: var(--mono); font-size: 12px; }
.config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
.config-grid .full { grid-column: 1 / -1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.15); }
.btn-green { background: var(--green); color: #111; }
.btn-red { background: var(--red); color: #fff; }
.btn-gray { background: #333; color: #aaa; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); }
.btn-group { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.console { background: #0d0e1a; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; height: 500px; overflow-y: auto; font-family: var(--mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
.console .dim { color: #555; }
.console .warn { color: var(--yellow); }
.console .err { color: var(--red); }
.console .ok { color: var(--green); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-on { background: #1a3a2a; color: var(--green); }
.badge-off { background: #2a1a1a; color: #666; }
.small { font-size: 12px; color: #888; }
.mt8 { margin-top: 8px; }
.msg { padding: 8px 12px; border-radius: 4px; font-size: 12px; margin-top: 8px; display: none; }
.msg-ok { background: #1a3a2a; color: var(--green); }
.msg-err { background: #2a1a1a; color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <div class="dot {{'off' if not daemon_running else ''}}" id="daemon-dot"></div>
  <h1>OJ Solver</h1>
  <span class="badge {{'badge-on' if daemon_running else 'badge-off'}}" id="daemon-badge">{{'守护运行中' if daemon_running else '守护已停止'}}</span>
</div>

<div class="tabs" style="max-width:1200px;margin:20px auto 0;padding:0 24px;">
  <button class="tab active" onclick="switchTab('solve')">求解</button>
  <button class="tab" onclick="switchTab('config')">配置</button>
</div>

<div class="main">
  <!-- ===== 求解面板 ===== -->
  <div id="tab-solve" class="active">
    <div>
      <div class="card">
        <h2>单个题目</h2>
        <form onsubmit="solveSingle(event)">
          <label>题目链接或 ID</label>
          <input id="url" placeholder="https://oj.yuanyicode.com/p/1178 或 1178">
          <div class="btn-group">
            <button class="btn btn-primary" type="submit">求解并提交</button>
            <button class="btn btn-outline" type="button" onclick="solveSingle(event, true)">仅生成题解</button>
            <button class="btn btn-outline" type="button" onclick="dryRun()">仅抓取题目</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>比赛批量</h2>
        <form onsubmit="solveContest(event)">
          <label>比赛 / 题目链接</label>
          <input id="contest-url" placeholder="https://oj.yuanyicode.com/d/domain/contest/xxx">
          <div class="btn-group">
            <button class="btn btn-green" type="submit">批量求解</button>
            <button class="btn btn-outline" type="button" onclick="solveContest(event, true)">仅生成题解</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>比赛守护</h2>
        <p class="small">监控域名，自动为已结束的比赛编写题解。</p>
        <div class="btn-group">
          <button class="btn btn-green" id="btn-daemon-start" onclick="daemon('start')">启动守护</button>
          <button class="btn btn-red" id="btn-daemon-stop" onclick="daemon('stop')" disabled>停止守护</button>
          <button class="btn btn-outline" onclick="daemon('once')">仅检查一次</button>
        </div>
        <div class="small mt8" id="daemon-interval"></div>
      </div>
    </div>
    <div class="card">
      <h2>控制台 <span id="task-badge" class="badge badge-off" style="display:none">运行中</span></h2>
      <div class="btn-group" style="margin-top:0;margin-bottom:10px;">
        <button class="btn btn-red" id="btn-kill" onclick="killTask()" disabled>终止任务</button>
        <button class="btn btn-outline" onclick="clearLog()">清屏</button>
      </div>
      <div class="console" id="console">等待操作...</div>
    </div>
    <div class="card">
      <h2>最近记录</h2>
      <div id="history" style="font-size:12px;color:#888;max-height:200px;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- ===== 配置面板 ===== -->
  <div id="tab-config" style="grid-template-columns:1fr 1fr;">
    <div class="card">
      <h2>OJ 账户</h2>
      <label>根地址</label><input id="cfg-oj-root">
      <label>API 前缀</label><input id="cfg-oj-base">
      <div class="config-grid">
        <div><label>用户名</label><input id="cfg-oj-user"></div>
        <div><label>密码</label><input id="cfg-oj-pass" type="password"></div>
      </div>
    </div>
    <div class="card">
      <h2>AI 模型</h2>
      <label>API 地址</label><input id="cfg-ai-url" placeholder="https://api.deepseek.com">
      <label>API Key（建议填 env:AI_API_KEY；留空保留）</label><input id="cfg-ai-key" type="password" autocomplete="new-password">
      <div class="config-grid">
        <div><label>模型</label><input id="cfg-ai-model"></div>
        <div><label>推理强度</label>
          <select id="cfg-ai-reasoning"><option value="">不指定</option>
            <option value="low">low</option><option value="medium">medium</option>
            <option value="high" selected>high</option><option value="max">max</option>
          </select>
        </div>
        <div><label>最大输出 Token</label><input id="cfg-ai-maxtok" type="number"></div>
      </div>
    </div>
    <div class="card">
      <h2>代码设置</h2>
      <label>提交语言 ID</label><input id="cfg-code-lang" placeholder="cc.cc14o2">
      <p class="small mt8">C++14: cc.cc14o2 | Python3: py.py3 | Java: java</p>
    </div>
    <div class="card">
      <h2>监控守护</h2>
      <label>监测域名（逗号分隔）</label><input id="cfg-mon-domains" placeholder="system, yuanyi__contestForPrimary">
      <label>检查间隔（秒）</label><input id="cfg-mon-interval" type="number">
      <label>状态文件</label><input id="cfg-mon-state" placeholder="processed_contests.json">
    </div>
    <div class="card">
      <h2>Token 与求解策略</h2>
      <label>求解输出上限（包含推理 Token）</label><input id="cfg-solve-budget" type="number" min="1">
      <label>方案输出上限</label><input id="cfg-plan-budget" type="number" min="1">
      <label>题解输出上限</label><input id="cfg-editorial-budget" type="number" min="1">
      <label><input id="cfg-detect" type="checkbox" style="width:auto"> 调用 AI 判断难度</label>
      <label><input id="cfg-compact" type="checkbox" style="width:auto"> 精简修复历史（保留完整题面与当前代码）</label>
      <p class="small mt8">模型独立设置会覆盖全局参数；预算与模型上限取较小值。</p>
    </div>
    <div class="card">
      <h2>访问设置</h2>
      <label>WebUI 访问令牌（仅启用 --auth-token 时填写）</label>
      <input id="cfg-web-token" type="password" autocomplete="off" oninput="sessionStorage.setItem('oj-auth', this.value)">
      <p class="small mt8">令牌只保存在当前浏览器会话。服务端环境变量优先于这里保存的配置。</p>
      <pre id="cfg-diagnostics" style="white-space:pre-wrap;margin-top:12px"></pre>
    </div>
    <div class="card full" style="grid-column: 1 / -1;">
      <div class="btn-group">
        <button class="btn btn-primary" onclick="loadConfig()">刷新配置</button>
        <button class="btn btn-green" onclick="saveConfig()">保存配置</button>
        <button class="btn btn-outline" onclick="diagnoseConfig()">检查配置（不调用 AI）</button>
        <span class="msg" id="cfg-msg"></span>
      </div>
    </div>
  </div>
</div>

<script>
function apiFetch(path, options = {}) {
  return fetch(path, {...options, headers: {...(options.headers || {}), 'X-Auth-Token': sessionStorage.getItem('oj-auth') || ''}});
}
document.getElementById('cfg-web-token').value = sessionStorage.getItem('oj-auth') || '';
const con = document.getElementById('console');
const evtSource = new EventSource('/stream');
evtSource.onmessage = function(e) {
  let html = '';
  for (const line of JSON.parse(e.data)) {
    const span = document.createElement('span');
    span.textContent = line + '\n';
    if (line.includes('[-]') || line.includes('ERROR')) span.className = 'err';
    else if (line.includes('[+]') || line.includes('成功') || line.includes('AC')) span.className = 'ok';
    con.appendChild(span);
  }
  con.scrollTop = con.scrollHeight;
};

function post(path, body) {
  return apiFetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r => r.json());
}

function solveSingle(e, noSubmit) {
  e.preventDefault();
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const args = [url];
  if (noSubmit) args.push('--no-submit');
  post('/run/oj_solver', {args});
}

function dryRun() {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  post('/run/oj_solver', {args: [url, '--dry-run']});
}

function solveContest(e, noSubmit) {
  e.preventDefault();
  const url = document.getElementById('contest-url').value.trim();
  if (!url) return;
  const args = [url];
  if (noSubmit) args.push('--no-submit');
  post('/run/contest_solver', {args});
}

function daemon(action) {
  post('/daemon/' + action, {});
  setTimeout(updateDaemonStatus, 1000);
}

function updateDaemonStatus() {
  apiFetch('/status').then(r => r.json()).then(s => {
    const on = s.daemon_running;
    document.getElementById('daemon-dot').className = 'dot' + (on ? '' : ' off');
    document.getElementById('daemon-badge').textContent = on ? '守护运行中' : '守护已停止';
    document.getElementById('daemon-badge').className = 'badge ' + (on ? 'badge-on' : 'badge-off');
    document.getElementById('btn-daemon-start').disabled = on;
    document.getElementById('btn-daemon-stop').disabled = !on;
    // 任务状态
    const tr = s.task_running;
    const badge = document.getElementById('task-badge');
    badge.style.display = tr ? 'inline-block' : 'none';
    badge.className = 'badge ' + (tr ? 'badge-on' : 'badge-off');
    document.getElementById('btn-kill').disabled = !tr;
  });
  // 刷新历史
  apiFetch('/history').then(r => r.json()).then(items => {
    const h = document.getElementById('history');
    h.textContent = '';
    if (items.length) {
      for (const i of items.reverse()) {
        const div = document.createElement('div');
        div.style.cssText = 'margin:2px 0;font-family:monospace';
        div.textContent = `[${i.time}] ${i.cmd.substring(0,60)}... → ${i.code===0?'OK':i.code}`;
        h.appendChild(div);
      }
    } else {
      h.textContent = '暂无记录';
    }
  });
}

function killTask() {
  apiFetch('/kill', {method:'POST'});
}

function clearLog() {
  document.getElementById('console').innerHTML = '';
  apiFetch('/clear', {method:'POST'});
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab[onclick*="'+name+'"]').forEach(t => t.classList.add('active'));
  document.querySelectorAll('.main > div').forEach(d => d.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'config') loadConfig();
}

function showMsg(text, ok) {
  const m = document.getElementById('cfg-msg');
  m.textContent = text; m.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
  m.style.display = 'block';
  setTimeout(() => m.style.display = 'none', 3000);
}

async function loadConfig() {
  try {
    const r = await apiFetch('/config');
    const c = await r.json();
    if (!r.ok) throw new Error(c.error || '读取失败');
    const fields = {'oj-root':'oj_root', 'oj-base':'oj_base', 'oj-user':'username',
      'ai-url':'ai_base_url', 'ai-model':'ai_model', 'ai-reasoning':'ai_reasoning_effort',
      'ai-maxtok':'ai_max_tokens', 'code-lang':'code_lang', 'mon-interval':'monitor_interval',
      'mon-state':'monitor_state_file'};
    for (const [id, key] of Object.entries(fields)) document.getElementById('cfg-'+id).value = c[key] ?? '';
    for (const [id, configured] of [['ai-key', c.ai_api_key_configured], ['oj-pass', c.password_configured]]) {
      const input = document.getElementById('cfg-'+id);
      input.value = '';
      input.placeholder = configured ? '已配置，留空保留' : '尚未配置';
    }
    document.getElementById('cfg-mon-domains').value = (c.monitor_domains || []).join(', ');
    document.getElementById('cfg-solve-budget').value = c.ai_task_tokens?.solve ?? 16384;
    document.getElementById('cfg-plan-budget').value = c.ai_task_tokens?.plan ?? 4096;
    document.getElementById('cfg-editorial-budget').value = c.ai_task_tokens?.editorial ?? 8192;
    document.getElementById('cfg-detect').checked = c.difficulty_detect_enable;
    document.getElementById('cfg-compact').checked = c.compact_history;
  } catch (error) { showMsg(error.message, false); }
}

async function saveConfig() {
  const value = id => document.getElementById('cfg-'+id).value.trim();
  const payload = {
    oj_root:value('oj-root'), oj_base:value('oj-base'), username:value('oj-user'),
    ai_base_url:value('ai-url'), ai_model:value('ai-model'), ai_reasoning_effort:value('ai-reasoning'),
    ai_max_tokens:Number(value('ai-maxtok')), code_lang:value('code-lang'),
    monitor_domains:value('mon-domains').split(',').map(s=>s.trim()).filter(Boolean),
    monitor_interval:Number(value('mon-interval')), monitor_state_file:value('mon-state'),
    ai_task_tokens:{solve:Number(value('solve-budget')), plan:Number(value('plan-budget')), editorial:Number(value('editorial-budget'))},
    difficulty_detect_enable:document.getElementById('cfg-detect').checked,
    compact_history:document.getElementById('cfg-compact').checked
  };
  if (value('ai-key')) payload.ai_api_key = value('ai-key');
  if (document.getElementById('cfg-oj-pass').value) payload.password = document.getElementById('cfg-oj-pass').value;
  try {
    const r = await apiFetch('/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const result = await r.json();
    if (!r.ok) throw new Error((result.errors || [result.error || '保存失败']).join('；'));
    showMsg('配置已保存', true);
    await loadConfig();
  } catch (error) { showMsg(error.message, false); }
}

async function diagnoseConfig() {
  const box = document.getElementById('cfg-diagnostics');
  try {
    const r = await apiFetch('/config/doctor');
    const result = await r.json();
    if (!r.ok) throw new Error(result.error || '检查失败');
    box.textContent = [result.ok ? '检查通过' : '请修正以下问题', ...result.errors, ...result.warnings,
      ...result.models.map(m => `${m.name}: ${m.provider}，输出上限 ${m.output_limit ?? '?'}`)].join('\n');
  } catch (error) { box.textContent = error.message; }
}

// 首次加载
updateDaemonStatus();
setInterval(updateDaemonStatus, 5000);
</script>
</body></html>
