name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hydrooj-aibot

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the container
        shell: bash
        run: bash .github/scripts/docker-smoke.sh 2>&1 | tee "$RUNNER_TEMP/docker-smoke.log"

      - name: Report container failure
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'docker-smoke.log'
          if path.exists():
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-80:])[-3500:]
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Container smoke test::{escaped}')

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker tag hydrooj-aibot:local "$IMAGE_NAME:$IMAGE_TAG"
          docker tag hydrooj-aibot:local "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"
          VERSION="$(python3 -c 'import hydroai; print(hydroai.__version__)')"
          docker tag hydrooj-aibot:local "$IMAGE_NAME:v$VERSION"
          docker push "$IMAGE_NAME:v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            SAFE_TAG="${REF_NAME//\//-}"
            docker tag hydrooj-aibot:local "$IMAGE_NAME:$SAFE_TAG"
            docker push "$IMAGE_NAME:$SAFE_TAG"
          fi
          {
            echo "### Docker image published"
            echo "- \`$IMAGE_NAME:$IMAGE_TAG\`"
            echo "- \`$IMAGE_NAME:latest\`"
            echo "- \`$IMAGE_NAME:v$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose --env-file config/.env logs --no-color || true
          docker compose --env-file config/.env down -v || true
