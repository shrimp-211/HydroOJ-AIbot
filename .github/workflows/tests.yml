name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the container
        shell: bash
        run: bash .github/scripts/docker-smoke.sh 2>&1 | tee "$RUNNER_TEMP/docker-smoke.log"
      - name: Report container failure
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'docker-smoke.log'
          if path.exists():
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-80:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Container smoke test::{escaped}')
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down -v
